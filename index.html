<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de mots de passe · EDEN School</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="box-password">
      <div class="menu-green">
        <div class="menu-eden">
          <h4 id="eden">EDEN School</h4>
          <h1 id="Générateur">Générateur de <br> mots de passe</h1>
          <div class="container-img">
            <img src="assets/cle.svg" alt="" srcset="">
          </div>
        </div>
      </div>
        <div class="password">
          <div class="barre-password">
            <h4 style="font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif ;">mots de passe</h4>
            <p style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">16 caractère</p>
          </div>
        </div>
        <div class="container-input">
          <input name="password" class="input-password"  placeholder="en attente du clic" type="password">
        </div>
        <div class="container-copie">
          <div class="div-copie">
            <button class="copie">copier</button>
          </div>
        </div>
        <div class="lance">
          <button id="password-genere" class="btn-lance">générer un mots de passe</button>
        </div>
    </div>
  </div>
 
</body>
</html>
